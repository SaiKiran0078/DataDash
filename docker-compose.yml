services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: datadash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: datadash
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datadash -d datadash"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://datadash:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}@db:5432/datadash
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your .env file (32+ random characters)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      TRUST_PROXY: "true"          # nginx sets X-Real-IP; used for rate limiting
    volumes:
      - datasets:/app/data
    # Do not start the web proxy until the API is actually ready. The health
    # endpoint also checks PostgreSQL, so this gates on both app + database.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 15s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DATADASH_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
  datasets:
